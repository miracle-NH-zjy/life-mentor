<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F4F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="导师">
<meta name="description" content="人生导师模拟器的每日打卡端：计划、打卡、复盘，数据只存在你自己的设备上。">
<title>人生导师 · 每日打卡</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>

<div class="shell">
  <header class="topbar">
    <div class="topbar-text">
      <p class="eyebrow" id="topEyebrow">人生导师</p>
      <h1 class="topbar-title" id="topTitle">今天</h1>
    </div>
    <button class="ghost-btn" id="btnTheme" type="button" aria-label="切换主题">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <circle cx="12" cy="12" r="4.2"></circle>
        <path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"></path>
      </svg>
    </button>
  </header>

  <main id="main">
    <section class="view" id="view-today" data-view="today"></section>
    <section class="view" id="view-plan" data-view="plan" hidden></section>
    <section class="view" id="view-review" data-view="review" hidden></section>
    <section class="view" id="view-settings" data-view="settings" hidden></section>
  </main>

  <nav class="tabbar" id="tabbar">
    <button class="tab is-active" type="button" data-tab="today">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 12.6l5 5L20 6.8"></path>
      </svg>
      <span>今日</span>
    </button>
    <button class="tab" type="button" data-tab="plan">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3.6" y="5.2" width="16.8" height="15.2" rx="2.6"></rect>
        <path d="M3.6 10h16.8M8.4 3.4v3.4M15.6 3.4v3.4"></path>
      </svg>
      <span>计划</span>
    </button>
    <button class="tab" type="button" data-tab="review">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19.4V13M10 19.4V6.6M16 19.4v-8.2M22 19.4H2"></path>
      </svg>
      <span>复盘</span>
    </button>
    <button class="tab" type="button" data-tab="settings">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 7.2h9M17 7.2h3M4 16.8h3M11 16.8h9"></path>
        <circle cx="15" cy="7.2" r="2.2"></circle>
        <circle cx="9" cy="16.8" r="2.2"></circle>
      </svg>
      <span>设置</span>
    </button>
  </nav>
</div>

<input type="file" id="filePlan" accept=".json,application/json" hidden>
<input type="file" id="fileLogs" accept=".jsonl,.json,application/json,text/plain" hidden>
<input type="file" id="fileBundle" accept=".json,application/json" hidden>
<input type="file" id="fileEvidence" accept="image/*" multiple hidden>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="./js/core/cal.js"></script>
<script src="./js/core/stats.js"></script>
<script src="./js/core/motivation.js"></script>
<script src="./js/core/store.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
